name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go we support (pgx needs 1.25), and whatever is current.
        go: ["1.25", "stable"]

    # The store, server and control plane contract tests run against a real
    # PostgreSQL. They skip when RUNNERLY_TEST_DATABASE_URL is unset, which is
    # what makes `go test ./...` work on a laptop without one, so CI has to
    # provide one or that coverage silently disappears.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runnerly
          POSTGRES_PASSWORD: runnerly
          POSTGRES_DB: runnerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runnerly -d runnerly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNNERLY_TEST_DATABASE_URL: postgres://runnerly:runnerly@localhost:5432/runnerly_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: make vet

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check the database tests actually ran
        # A skipped integration suite looks identical to a passing one, so
        # fail loudly if the database was not reachable.
        run: |
          go test -count=1 -run TestUpsertRunnerIsIdempotent -v ./internal/store/ \
            | tee /tmp/store.log
          if grep -q -- '--- SKIP' /tmp/store.log; then
            echo "::error::the store tests skipped; PostgreSQL was not reachable"
            exit 1
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  web:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Build
        working-directory: web
        run: npm run build

      # The Go server embeds these, so the build job downloads them rather
      # than installing Node again.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The version is pinned in the Makefile so local and CI runs agree.
      - name: golangci-lint
        run: make lint

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Release binaries carry the dashboard, so wait for it.
    needs: web
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs history to produce a version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Fetch the built dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      - name: Check the dashboard made it into the binary
        # A binary that silently ships without the UI looks identical until
        # someone opens it, so fail here instead.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          test -f internal/web/dist/index.html
          grep -q 'id="root"' internal/web/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: runnerly-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/runnerly
            dist/runnerly-agent
            dist/runnerly-server
          if-no-files-found: error
