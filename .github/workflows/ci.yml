name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # The dashboard tests skip when no dashboard is embedded, so the suite
    # runs against a real build rather than quietly covering nothing.
    needs: web
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go we support (pgx needs 1.25), and whatever is current.
        go: ["1.25", "stable"]

    # The store, server and control plane contract tests run against a real
    # PostgreSQL. They skip when RUNNERLY_TEST_DATABASE_URL is unset, which is
    # what makes `go test ./...` work on a laptop without one, so CI has to
    # provide one or that coverage silently disappears.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runnerly
          POSTGRES_PASSWORD: runnerly
          POSTGRES_DB: runnerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runnerly -d runnerly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNNERLY_TEST_DATABASE_URL: postgres://runnerly:runnerly@localhost:5432/runnerly_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Fetch the built dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist

      - name: Check formatting
        run: make fmt-check

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check the dashboard build left the repository clean
        # The build writes into internal/web/dist, which is ignored apart
        # from the marker that keeps the directory in git. Anything else
        # showing up means the ignore rules drifted.
        run: git diff --exit-code

      - name: Vet
        run: make vet

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check the dashboard tests actually ran
        # A skipped suite looks like a passing one in the summary, which is
        # how this coverage would quietly disappear.
        run: |
          go test -count=1 -run TestClientRoutesFallBackToTheShell -v ./internal/web/ \
            | tee /tmp/web.log
          if grep -q -- '--- SKIP' /tmp/web.log; then
            echo "::error::the dashboard tests skipped; the built assets were not in place"
            exit 1
          fi

      - name: Check the database tests actually ran
        # A skipped integration suite looks identical to a passing one, so
        # fail loudly if the database was not reachable.
        run: |
          go test -count=1 -run TestUpsertRunnerIsIdempotent -v ./internal/store/ \
            | tee /tmp/store.log
          if grep -q -- '--- SKIP' /tmp/store.log; then
            echo "::error::the store tests skipped; PostgreSQL was not reachable"
            exit 1
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  web:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Build
        working-directory: web
        run: npm run build

      # The Go server embeds these, so the build job downloads them rather
      # than installing Node again.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist
          if-no-files-found: error

  site:
    name: landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Lint
        working-directory: site
        run: npm run lint

      # Cross-references between the docs are routes on the site now, so a
      # link to a renamed page is a 404 rather than a dead GitHub link.
      - name: Check the documentation links
        working-directory: site
        run: npm run check-docs

      - name: Build
        working-directory: site
        run: npm run build

      # The page tells people to curl this URL. If the copy step ever stops
      # working, the site would 404 the one command it advertises.
      - name: Check the installer is published with the site
        run: |
          test -f site/dist/install.sh
          head -1 site/dist/install.sh | grep -q '^#!/bin/sh'

      # Deep links like /docs/agent are client-side routes, so the host has
      # to fall back to index.html. Without this file every link off the
      # landing page 404s in production while working perfectly in dev.
      - name: Check the SPA fallback is published
        run: |
          test -f site/dist/_redirects
          grep -q '/index.html' site/dist/_redirects

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --shell=sh install.sh

      # Run the whole installer against a release built here, so the download,
      # checksum and unpack paths are exercised rather than assumed.
      - name: Install from a local release
        run: |
          set -euo pipefail
          rel="$(mktemp -d)"
          dest="$(mktemp -d)"
          name="runnerly_v0.0.0-test_linux_amd64"
          mkdir -p "$rel/$name"
          for b in runnerly runnerly-agent runnerly-server; do
            printf '#!/bin/sh\necho %s\n' "$b" > "$rel/$name/$b"
            chmod +x "$rel/$name/$b"
          done
          tar -C "$rel" -czf "$rel/$name.tar.gz" "$name"
          rm -rf "$rel/${name:?}"
          (cd "$rel" && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS)

          RUNNERLY_VERSION=v0.0.0-test \
          RUNNERLY_BASE_URL="file://$rel" \
          RUNNERLY_PREFIX="$dest" \
            sh install.sh

          "$dest/bin/runnerly" | grep -q runnerly

      - name: Refuse a tampered archive
        run: |
          set -euo pipefail
          rel="$(mktemp -d)"
          dest="$(mktemp -d)"
          name="runnerly_v0.0.0-test_linux_amd64"
          mkdir -p "$rel/$name"
          echo x > "$rel/$name/runnerly"
          tar -C "$rel" -czf "$rel/$name.tar.gz" "$name"
          rm -rf "$rel/${name:?}"
          (cd "$rel" && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS)
          echo tampered >> "$rel/$name.tar.gz"

          if RUNNERLY_VERSION=v0.0.0-test \
             RUNNERLY_BASE_URL="file://$rel" \
             RUNNERLY_PREFIX="$dest" \
               sh install.sh; then
            echo "the installer accepted an archive that failed its checksum"
            exit 1
          fi
          # And left nothing behind.
          test ! -e "$dest/bin/runnerly"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The version is pinned in the Makefile so local and CI runs agree.
      - name: golangci-lint
        run: make lint

      # The workflows are code too, and a typo in one is only discovered by
      # pushing. actionlint also runs shellcheck over every `run:` block.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Release binaries carry the dashboard, so wait for it.
    needs: web
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs history to produce a version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Fetch the built dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      - name: Check the dashboard made it into the binary
        # A binary that silently ships without the UI looks identical until
        # someone opens it, so fail here instead.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          test -f internal/web/dist/index.html
          grep -q 'id="root"' internal/web/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: runnerly-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/runnerly
            dist/runnerly-agent
            dist/runnerly-server
          if-no-files-found: error
