name: release

# Tagging is the whole trigger. `git tag v0.1.0 && git push --tags` builds
# every target, publishes the archives with their checksums, and install.sh
# picks them up without anything else being done by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check the dashboard actually built
        # An empty dist would produce release binaries that serve the
        # "no dashboard" placeholder, which nobody would notice until they
        # opened one.
        run: |
          test -f internal/web/dist/index.html
          grep -q 'id="root"' internal/web/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist
          if-no-files-found: error

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: web
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is stamped from `git describe`, which needs history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Fetch the built dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: internal/web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="runnerly_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "release/${name}"
          cp dist/runnerly dist/runnerly-agent dist/runnerly-server "release/${name}/"
          cp README.md LICENSE "release/${name}/"
          tar -C release -czf "release/${name}.tar.gz" "${name}"
          rm -rf "release/${name}"

      # Each job checksums its own archive. The release job concatenates
      # them, so a corrupted upload cannot be papered over by a checksum
      # computed somewhere else.
      - name: Checksum
        working-directory: release
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          archive="runnerly_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz"
          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every archive
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Collect the checksums
        working-directory: release
        run: |
          set -euo pipefail
          # Paths are stripped so `sha256sum -c` works from the directory the
          # archives were downloaded into, which is what install.sh does.
          cat ./*.sha256 | sed 's|\./||' | sort -k2 > SHA256SUMS
          rm -f ./*.tar.gz.sha256
          cat SHA256SUMS

      - name: Verify what is about to be published
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Install

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | sh
          \`\`\`

          Then:

          \`\`\`
          runnerly setup
          \`\`\`

          Every archive is listed in \`SHA256SUMS\`, which the installer
          verifies before it unpacks anything.
          EOF
          # A tag with a suffix (v1.0.0-rc1) is a prerelease.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac

          # $prerelease is one flag or empty; quoting it would hand gh an
          # empty argument.
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --verify-tag \
            $prerelease \
            release/*
